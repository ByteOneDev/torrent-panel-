# Motflix — stack de services
#
# Ce fichier est copié dans le dossier d'installation par scripts/install.sh.
# Les valeurs ${...} viennent du fichier .env généré à l'installation.
#
# Profils (variable COMPOSE_PROFILES dans .env) :
#   vpn    → Gluetun + qBittorrent qui passe par le VPN
#   novpn  → qBittorrent sur le réseau normal
#   plex   → serveur Plex
#
# Le mode réseau de Plex dépend de l'OS (variable COMPOSE_FILE dans .env) :
#   Linux → compose.plex-host.yml   (réseau de l'hôte, découverte automatique sur la télé)
#   macOS → compose.plex-bridge.yml (ports publiés, Docker tourne dans une VM)

name: motflix

x-linuxserver: &linuxserver
  restart: unless-stopped
  environment: &linuxserver-env
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}

networks:
  motflix:
    name: motflix
    # Sous-réseau fixe : les conteneurs reçoivent une adresse dans 172.31.250.128/25,
    # la passerelle (.1) reste en dehors. Les connexions venant de l'hôte passent par
    # la passerelle : qBittorrent peut donc dispenser de mot de passe les seuls
    # conteneurs (voir WebUI\AuthSubnetWhitelist dans install.sh).
    ipam:
      config:
        - subnet: 172.31.250.0/24
          ip_range: 172.31.250.128/25
          gateway: 172.31.250.1

services:
  # ─── Panel ───────────────────────────────────────────────────────────
  motflix:
    image: motflix-panel:${MOTFLIX_VERSION}
    build:
      context: ${MOTFLIX_SRC}   # dossier du projet, construit par install.sh / update.sh
    container_name: motflix-panel
    restart: unless-stopped
    user: ${PUID}:${PGID}   # la base du panel appartient à l'utilisateur, comme le reste
    environment:
      TZ: ${TZ}
      DOCKER_HOST: http://socket-proxy:2375
      COMPOSE_PROJECT: motflix
      TOOLS_BIND: ${TOOLS_BIND}
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      LAZYLIBRARIAN_API_KEY: ${LAZYLIBRARIAN_API_KEY}
      QBITTORRENT_USER: ${QBITTORRENT_USER}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
    volumes:
      - ./config/motflix:/config
      - ${DATA_DIR}:/data:ro
    ports:
      - ${PANEL_PORT:-8080}:8080   # visible sur le réseau local
    depends_on: [socket-proxy]
    networks: [motflix]

  # Accès à Docker limité à ce dont le panel a besoin : lire l'état, les logs et
  # les statistiques des conteneurs, et les démarrer / arrêter / redémarrer.
  # Création et suppression de conteneurs, exec, images, volumes : refusés.
  socket-proxy:
    image: lscr.io/linuxserver/socket-proxy:latest
    container_name: motflix-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs: [/run]
    environment:
      CONTAINERS: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      ALLOW_LOGS: 1
      POST: 0
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [motflix]

  # ─── VPN (profil vpn) ────────────────────────────────────────────────
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: motflix-gluetun
    profiles: [vpn]
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ}
      VPN_SERVICE_PROVIDER: ${VPN_PROVIDER:-}
      VPN_TYPE: ${VPN_TYPE:-wireguard}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY:-}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES:-}
      OPENVPN_USER: ${OPENVPN_USER:-}
      OPENVPN_PASSWORD: ${OPENVPN_PASSWORD:-}
      SERVER_COUNTRIES: ${VPN_COUNTRIES:-}
      VPN_PORT_FORWARDING: ${VPN_PORT_FORWARDING:-off}
      # Ne choisit que des serveurs qui savent ouvrir un port (ProtonVPN, PIA).
      PORT_FORWARD_ONLY: ${VPN_PORT_FORWARD_ONLY:-off}
      # Quand le fournisseur VPN ouvre un port, on le donne aussitôt à qBittorrent.
      VPN_PORT_FORWARDING_UP_COMMAND: >-
        /bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8090/api/v2/app/setPreferences 2>&1'
      # Laisse les autres conteneurs joindre l'interface de qBittorrent.
      FIREWALL_INPUT_PORTS: "8090"
      HTTP_CONTROL_SERVER_ADDRESS: ":8000"
    volumes:
      - ./config/gluetun:/gluetun
    ports:
      - ${TOOLS_BIND}:8090:8090   # interface qBittorrent
    networks:
      motflix:
        # Les autres outils joignent toujours qBittorrent via « qbittorrent:8090 »,
        # avec ou sans VPN.
        aliases: [qbittorrent]

  qbittorrent-vpn:
    <<: *linuxserver
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: motflix-qbittorrent-vpn
    profiles: [vpn]
    # Tout le trafic passe par Gluetun : si le VPN tombe, plus aucun réseau.
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      <<: *linuxserver-env
      WEBUI_PORT: 8090
      TORRENTING_PORT: ${TORRENT_PORT}
    volumes:
      - ./config/qbittorrent:/config
      - ${DATA_DIR}:/data

  # ─── Téléchargement sans VPN (profil novpn) ──────────────────────────
  qbittorrent:
    <<: *linuxserver
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: motflix-qbittorrent
    profiles: [novpn]
    environment:
      <<: *linuxserver-env
      WEBUI_PORT: 8090
      TORRENTING_PORT: ${TORRENT_PORT}
    volumes:
      - ./config/qbittorrent:/config
      - ${DATA_DIR}:/data
    ports:
      - ${TOOLS_BIND}:8090:8090
      - ${TORRENT_PORT}:${TORRENT_PORT}
      - ${TORRENT_PORT}:${TORRENT_PORT}/udp
    networks: [motflix]

  # ─── Indexeurs ───────────────────────────────────────────────────────
  prowlarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: motflix-prowlarr
    volumes:
      - ./config/prowlarr:/config
    ports:
      - ${TOOLS_BIND}:9696:9696
    networks: [motflix]

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: motflix-flaresolverr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports:
      - ${TOOLS_BIND}:8191:8191
    networks: [motflix]

  # ─── Films, séries, livres ───────────────────────────────────────────
  radarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/radarr:latest
    container_name: motflix-radarr
    volumes:
      - ./config/radarr:/config
      - ${DATA_DIR}:/data
    ports:
      - ${TOOLS_BIND}:7878:7878
    extra_hosts:
      - host.docker.internal:host-gateway   # pour joindre Plex en réseau hôte
    networks: [motflix]

  sonarr:
    <<: *linuxserver
    image: lscr.io/linuxserver/sonarr:latest
    container_name: motflix-sonarr
    volumes:
      - ./config/sonarr:/config
      - ${DATA_DIR}:/data
    ports:
      - ${TOOLS_BIND}:8989:8989
    extra_hosts:
      - host.docker.internal:host-gateway
    networks: [motflix]

  lazylibrarian:
    <<: *linuxserver
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: motflix-lazylibrarian
    volumes:
      - ./config/lazylibrarian:/config
      - ${DATA_DIR}:/data
    ports:
      - ${TOOLS_BIND}:5299:5299
    networks: [motflix]

  # ─── Lecture ─────────────────────────────────────────────────────────
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: motflix-audiobookshelf
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    volumes:
      - ./config/audiobookshelf/config:/config
      - ./config/audiobookshelf/metadata:/metadata
      - ${DATA_DIR}:/data
    ports:
      - 13378:80   # visible sur le réseau local (appli mobile)
    networks: [motflix]

  plex:
    <<: *linuxserver
    image: lscr.io/linuxserver/plex:latest
    container_name: motflix-plex
    profiles: [plex]
    environment:
      <<: *linuxserver-env
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM:-}
    volumes:
      - ./config/plex:/config
      - ${DATA_DIR}:/data
