# Réglages propres à Linux (choisi par install.sh via COMPOSE_FILE).
# Plex sur Linux : réseau de l'hôte, pour que la télé trouve le serveur toute seule.
services:
  plex:
    network_mode: host
    # Transcodage matériel (processeur Intel/AMD avec iGPU) : décommenter.
    # devices:
    #   - /dev/dri:/dev/dri

  # Plex n'est pas sur le réseau Docker : le panel le joint via l'hôte.
  # Disques branchés (/media/<utilisateur>/<disque>) visibles pour l'import, même
  # branchés après le démarrage (propagation des montages).
  motflix:
    environment:
      PLEX_URL: http://host.docker.internal:32400
      IMPORT_LAYOUT: user
      IMPORT_HOST_PATH: /media
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - { type: bind, source: /media, target: /import, read_only: true, bind: { propagation: rslave, create_host_path: true } }

  radarr:
    volumes:
      - { type: bind, source: /media, target: /import, bind: { propagation: rslave, create_host_path: true } }

  sonarr:
    volumes:
      - { type: bind, source: /media, target: /import, bind: { propagation: rslave, create_host_path: true } }
