<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0f15" />
    <meta name="description" content="Panel d'administration Motflix" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Motflix</title>
    <script>
      // Thème appliqué avant l'affichage, pour éviter un flash clair/sombre.
      try {
        const t = localStorage.getItem('motflix-theme');
        document.documentElement.dataset.theme =
          t || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch { document.documentElement.dataset.theme = 'dark'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
